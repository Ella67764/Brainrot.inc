<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ons Product - Landingspagina</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #2b6cb0;
            color: white;
            padding: 50px 20px;
        }
        main {
            padding: 40px 20px;
            max-width: 800px;
            margin: auto;
        }
        button {
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2c5282;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welkom bij [Naam van jullie product]</h1>
        <p>Dé slimme oplossing voor [beschrijf hier kort het probleem dat jullie oplossen].</p>
    </header>

    <main>
        <h2>Probeer onze eerste functie</h2>
        <p>Klik op de knop hieronder om het product in actie te zien.</p>
        <button id="actie-knop">Start Functie</button>
        <p id="resultaat"></p>
    </main>

    <script src="app.js"></script>
</body>
</html>
